<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <link rel="stylesheet" href="style003.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="https://id.selendra.org/images/did.png" alt="Digital ID Logo" class="logo" />

      <h2>Sign in to SalaDigital</h2>
      <p>Welcome back! Please sign in to continue</p>

      <button class="btn telegram">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" alt="Telegram Icon" />
        <span>Log in with Telegram</span>
      </button>

      <button class="btn google">
        <img src="https://img.icons8.com/?size=512&id=17949&format=png" alt="Google Icon" />
        <span>Login with Google</span>
      </button>

      <button class="btn email">
        <img src="https://cdn-icons-png.flaticon.com/512/3064/3064197.png" alt="Email Icon" />
        <span>Email or Phone</span>
      </button>

      <p class="footer-text">
        Secured by
        <img src="https://id.selendra.org/images/did.png" alt="Digital ID" class="footer-logo" />
      </p>
    </div>
  </div>
</body>
</html>
